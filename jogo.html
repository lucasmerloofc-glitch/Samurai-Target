<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Samurai Target</title>

<style>
*{
    box-sizing:border-box;
    user-select:none;
    touch-action:none;
}

body{
    margin:0;
    overflow:hidden;
    background:#080808;
    font-family:Arial,sans-serif;
    color:white;
}

#game{
    width:100vw;
    height:100vh;
    position:relative;
    overflow:hidden;
    background:
        radial-gradient(circle at center,#202020,#050505 75%);
}

#hud{
    position:absolute;
    top:10px;
    left:10px;
    right:10px;
    z-index:20;
    display:flex;
    flex-wrap:wrap;
    gap:8px;
}

.stat{
    background:#111;
    border:1px solid #444;
    border-radius:10px;
    padding:8px 11px;
    font-weight:bold;
    font-size:14px;
}

#shopBtn{
    position:absolute;
    top:65px;
    right:10px;
    z-index:30;
    background:#d99b00;
    color:white;
    border:0;
    border-radius:12px;
    padding:11px 15px;
    font-size:15px;
    font-weight:bold;
}

#bossbar{
    display:none;
    position:absolute;
    top:110px;
    left:10%;
    width:80%;
    height:18px;
    border:2px solid #900;
    background:#300;
    border-radius:10px;
    z-index:20;
    overflow:hidden;
}

#bosshealth{
    height:100%;
    width:100%;
    background:red;
    transition:.2s;
}

.target{
    position:absolute;
    width:78px;
    height:78px;
    border-radius:18px;
    background:#151515;
    border:2px solid #777;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:48px;
    z-index:10;
    box-shadow:0 0 15px #000;
}

.target:active{
    transform:scale(.88);
}

.hpbar{
    position:absolute;
    top:-10px;
    left:5px;
    width:64px;
    height:8px;
    background:#450000;
    border:1px solid #222;
    border-radius:5px;
    overflow:hidden;
}

.hp{
    width:100%;
    height:100%;
    background:#20d840;
    transition:.15s;
}

.boss{
    width:125px;
    height:125px;
    font-size:78px;
    border-color:red;
    box-shadow:0 0 30px red;
}

#crosshair{
    position:absolute;
    width:34px;
    height:34px;
    border:3px solid red;
    border-radius:50%;
    transform:translate(-50%,-50%);
    pointer-events:none;
    z-index:50;
}

#crosshair:after{
    content:"";
    position:absolute;
    width:8px;
    height:8px;
    background:red;
    border-radius:50%;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
}

#player{
    position:absolute;
    bottom:25px;
    left:50%;
    transform:translateX(-50%);
    width:70px;
    height:100px;
    z-index:5;
}

.head{
    position:absolute;
    width:42px;
    height:42px;
    border-radius:50%;
    background:#d49b75;
    left:14px;
    top:0;
}

.hair{
    position:absolute;
    width:45px;
    height:20px;
    background:#111;
    border-radius:20px 20px 5px 5px;
    left:12px;
    top:-3px;
}

.body{
    position:absolute;
    width:55px;
    height:55px;
    background:#eee;
    left:8px;
    top:38px;
    border-radius:8px;
}

.belt{
    position:absolute;
    width:60px;
    height:8px;
    background:#b40000;
    left:5px;
    top:65px;
}

.arm{
    position:absolute;
    width:12px;
    height:48px;
    background:#eee;
    top:42px;
}

.arm.left{left:0;transform:rotate(25deg)}
.arm.right{right:0;transform:rotate(-25deg)}

.weapon{
    position:absolute;
    width:55px;
    height:5px;
    background:#aaa;
    right:-45px;
    top:43px;
    transform:rotate(-35deg);
}

#message{
    position:absolute;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
    text-align:center;
    z-index:100;
}

#message h1{
    font-size:38px;
    margin:0 0 15px;
}

#start{
    background:#c40000;
    color:white;
    border:0;
    padding:14px 25px;
    border-radius:12px;
    font-size:18px;
    font-weight:bold;
}

#flash{
    position:absolute;
    inset:0;
    background:white;
    opacity:0;
    pointer-events:none;
    z-index:80;
}

#shop{
    display:none;
    position:absolute;
    inset:0;
    background:rgba(0,0,0,.88);
    z-index:200;
    align-items:center;
    justify-content:center;
}

.shopBox{
    width:min(90%,400px);
    max-height:85vh;
    overflow:auto;
    background:#151515;
    border:2px solid #555;
    border-radius:18px;
    padding:20px;
}

.shopBox h2{
    text-align:center;
    margin-top:0;
}

.shopItem{
    background:#222;
    border:1px solid #444;
    border-radius:12px;
    padding:13px;
    margin:10px 0;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
}

.shopIcon{
    font-size:35px;
}

.buy{
    background:#d99b00;
    color:white;
    border:0;
    border-radius:8px;
    padding:9px 12px;
    font-weight:bold;
}

.buy:disabled{
    background:#555;
}

#closeShop{
    width:100%;
    margin-top:10px;
    padding:12px;
    border:0;
    border-radius:10px;
    background:#900;
    color:white;
    font-weight:bold;
}

#shopMessage{
    text-align:center;
    min-height:20px;
    color:#ffd43b;
}
</style>
</head>

<body>

<div id="game">

    <div id="hud">
        <div class="stat">🎯 <span id="score">0</span></div>
        <div class="stat">🔥 <span id="combo">0</span></div>
        <div class="stat">🏆 <span id="record">0</span></div>
        <div class="stat">⚔️ Fase <span id="phase">1</span></div>
        <div class="stat">🪙 <span id="coins">0</span></div>
    </div>

    <button id="shopBtn">🛒 LOJA</button>

    <div id="bossbar">
        <div id="bosshealth"></div>
    </div>

    <div id="crosshair"></div>
    <div id="flash"></div>

    <div id="player">
        <div class="head"></div>
        <div class="hair"></div>
        <div class="body"></div>
        <div class="belt"></div>
        <div class="arm left"></div>
        <div class="arm right"></div>
        <div class="weapon"></div>
    </div>

    <div id="message">
        <h1>🥷 SAMURAI TARGET</h1>
        <button id="start">COMEÇAR</button>
    </div>

    <!-- LOJA -->
    <div id="shop">
        <div class="shopBox">

            <h2>🛒 LOJA DO SAMURAI</h2>

            <p style="text-align:center">
                🪙 Moedas: <b id="shopCoins">0</b>
            </p>

            <p id="shopMessage"></p>

            <div class="shopItem">
                <div>
                    <div class="shopIcon">⚔️</div>
                    <b>Espada de Aço</b>
                    <br>
                    <small>Visual da arma</small>
                </div>
                <button class="buy" onclick="buyItem('sword',100)">
                    🪙 100
                </button>
            </div>

            <div class="shopItem">
                <div>
                    <div class="shopIcon">🔥</div>
                    <b>Aura Flamejante</b>
                    <br>
                    <small>Efeito especial</small>
                </div>
                <button class="buy" onclick="buyItem('fire',250)">
                    🪙 250
                </button>
            </div>

            <div class="shopItem">
                <div>
                    <div class="shopIcon">👹</div>
                    <b>Máscara Demoníaca</b>
                    <br>
                    <small>Visual lendário</small>
                </div>
                <button class="buy" onclick="buyItem('mask',500)">
                    🪙 500
                </button>
            </div>

            <div class="shopItem">
                <div>
                    <div class="shopIcon">⚡</div>
                    <b>Modo Relâmpago</b>
                    <br>
                    <small>Item especial</small>
                </div>
                <button class="buy" onclick="buyItem('lightning',1000)">
                    🪙 1000
                </button>
            </div>

            <button id="closeShop">FECHAR</button>
        </div>
    </div>

</div>

<script>

let score = 0;
let combo = 0;
let phase = 1;
let playing = false;
let boss = false;
let bossHP = 20;
let spawnTimer;
let difficulty = 1000;

let record = Number(localStorage.getItem("samuraiRecord")) || 0;
let coins = Number(localStorage.getItem("samuraiCoins")) || 0;

let inventory =
JSON.parse(localStorage.getItem("samuraiInventory")) || {};

const scoreEl = document.getElementById("score");
const comboEl = document.getElementById("combo");
const recordEl = document.getElementById("record");
const phaseEl = document.getElementById("phase");
const coinsEl = document.getElementById("coins");
const shopCoinsEl = document.getElementById("shopCoins");

recordEl.textContent = record;

function updateCoins(){

    coinsEl.textContent = coins;
    shopCoinsEl.textContent = coins;

    localStorage.setItem(
        "samuraiCoins",
        coins
    );
}

function hud(){

    scoreEl.textContent = score;
    comboEl.textContent = combo;
    phaseEl.textContent = phase;
    recordEl.textContent = record;

    updateCoins();
}

function sound(freq,duration){

    try{

        const audio =
        new AudioContext();

        const osc =
        audio.createOscillator();

        const gain =
        audio.createGain();

        osc.frequency.value = freq;

        osc.connect(gain);
        gain.connect(audio.destination);

        gain.gain.value = .08;

        osc.start();

        setTimeout(()=>{
            osc.stop();
            audio.close();
        },duration);

    }catch(e){}
}

function hitEffect(){

    const flash =
    document.getElementById("flash");

    flash.style.opacity = ".25";

    setTimeout(()=>{
        flash.style.opacity = "0";
    },70);
}

function randomPosition(size=78){

    const maxX =
    window.innerWidth-size-10;

    const maxY =
    window.innerHeight-size-100;

    return {

        x:Math.max(5,
        Math.random()*maxX),

        y:Math.max(100,
        Math.random()*maxY)

    };
}

function spawnTarget(){

    if(!playing || boss) return;

    const target =
    document.createElement("div");

    target.className="target";

    const pos =
    randomPosition();

    target.style.left =
    pos.x+"px";

    target.style.top =
    pos.y+"px";

    target.innerHTML = `
        🥷
        <div class="hpbar">
            <div class="hp"></div>
        </div>
    `;

    let health = 3;

    const hp =
    target.querySelector(".hp");

    target.onclick = function(e){

        e.stopPropagation();

        health--;

        hp.style.width =
        (health/3*100)+"%";

        hitEffect();

        sound(500,60);

        if(health <= 0){

            target.remove();

            score += 10;
            combo++;

            // Ganha moedas por derrotar ninja
            coins += 2;

            if(combo % 10 === 0){

                score += 100;
                coins += 10;

                showMessage(
                    "🔥 COMBO! +10 🪙"
                );
            }

            if(score > record){

                record = score;

                localStorage.setItem(
                    "samuraiRecord",
                    record
                );
            }

            // Nova fase
            if(score >= phase*100){

                phase++;

                difficulty =
                Math.max(
                    300,
                    difficulty-80
                );

                if(phase % 5 === 0){

                    startBoss();

                }

            }

            hud();
        }
    };

    document
    .getElementById("game")
    .appendChild(target);

    setTimeout(()=>{

        if(target.parentNode)
            target.remove();

    },Math.max(1800,difficulty*2));
}

function spawnLoop(){

    if(!playing || boss) return;

    spawnTarget();

    spawnTimer =
    setTimeout(
        spawnLoop,
        difficulty
    );
}

function startBoss(){

    boss = true;

    clearTimeout(spawnTimer);

    bossHP = 20;

    const bar =
    document.getElementById("bossbar");

    const health =
    document.getElementById("bosshealth");

    bar.style.display="block";

    health.style.width="100%";

    const target =
    document.createElement("div");

    target.className =
    "target boss";

    const pos =
    randomPosition(125);

    target.style.left =
    pos.x+"px";

    target.style.top =
    pos.y+"px";

    target.textContent="👹";

    target.onclick=function(e){

        e.stopPropagation();

        bossHP--;

        health.style.width =
        (bossHP/20*100)+"%";

        score += 25;

        hitEffect();

        sound(150,100);

        if(bossHP <= 0){

            target.remove();

            boss=false;

            bar.style.display="none";

            score += 500;
            coins += 100;

            showMessage(
                "👹 BOSS DERROTADO! +100 🪙"
            );

            hud();

            setTimeout(
                spawnLoop,
                500
            );
        }

        hud();
    };

    document
    .getElementById("game")
    .appendChild(target);
}

function showMessage(text){

    const old =
    document.getElementById("comboMessage");

    if(old) old.remove();

    const msg =
    document.createElement("div");

    msg.id="comboMessage";

    msg.textContent=text;

    msg.style.position="absolute";
    msg.style.top="40%";
    msg.style.left="50%";
    msg.style.transform="translate(-50%,-50%)";
    msg.style.fontSize="28px";
    msg.style.fontWeight="bold";
    msg.style.zIndex="150";

    document
    .getElementById("game")
    .appendChild(msg);

    setTimeout(()=>{
        msg.remove();
    },1200);
}

function gameOver(){

    playing=false;

    clearTimeout(spawnTimer);

    document
    .querySelectorAll(".target")
    .forEach(t=>t.remove());

    document.getElementById("bossbar")
    .style.display="none";

    document
    .getElementById("message")
    .style.display="block";

    document
    .querySelector("#message h1")
    .textContent=
    "💀 FIM DE JOGO";

    document
    .getElementById("start")
    .textContent="JOGAR NOVAMENTE";
}

function startGame(){

    score=0;
    combo=0;
    phase=1;
    difficulty=1000;
    boss=false;
    playing=true;

    document
    .getElementById("message")
    .style.display="none";

    document
    .querySelectorAll(".target")
    .forEach(t=>t.remove());

    hud();

    spawnLoop();
}

document
.getElementById("start")
.onclick=startGame;


// Mira
document
.getElementById("game")
.addEventListener(
"pointermove",
e=>{

    const cross =
    document.getElementById("crosshair");

    cross.style.left =
    e.clientX+"px";

    cross.style.top =
    e.clientY+"px";

});


// Clique fora
document
.getElementById("game")
.addEventListener(
"pointerdown",
e=>{

    if(
        e.target.classList.contains("target") ||
        e.target.closest(".target") ||
        e.target.id==="shopBtn"
    ) return;

    if(playing){

        combo=0;

        hud();

        sound(100,50);
    }

});


// ABRIR LOJA
document
.getElementById("shopBtn")
.onclick=function(e){

    e.stopPropagation();

    document
    .getElementById("shop")
    .style.display="flex";

    updateCoins();
};


// FECHAR LOJA
document
.getElementById("closeShop")
.onclick=function(){

    document
    .getElementById("shop")
    .style.display="none";

};


// COMPRAR ITEM
function buyItem(item,price){

    const message =
    document.getElementById("shopMessage");

    if(inventory[item]){

        message.textContent=
        "✅ Você já possui este item!";

        return;
    }

    if(coins < price){

        message.textContent=
        "❌ Você precisa de mais moedas!";

        return;
    }

    coins -= price;

    inventory[item]=true;

    localStorage.setItem(
        "samuraiInventory",
        JSON.stringify(inventory)
    );

    updateCoins();

    message.textContent=
    "✅ Item comprado!";

    sound(700,150);
}

updateCoins();

</script>

</body>
</html>
